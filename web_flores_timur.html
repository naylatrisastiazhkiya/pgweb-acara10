<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web GIS Flores Timur</title>

    <!-- CSS & JS Leaflet Standar -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        html,
        body,
        #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        .legend-box {
            background: #ffffff;
            padding: 10px 12px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.25);
            max-height: 320px;
            overflow-y: auto;
            font-family: Arial, sans-serif;
            font-size: 12px;
        }

        .legend-title {
            font-weight: bold;
            margin: 6px 0 4px 0;
            border-bottom: 1px solid #ddd;
            padding-bottom: 2px;
        }

        .legend-title:first-child {
            margin-top: 0;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <script>
        // Fungsi L.Geoserver mandiri (mendukung multi-legenda)
        L.Geoserver = {
            wms: function (wmsUrl, options) {
                return L.tileLayer.wms(wmsUrl, Object.assign({
                    format: "image/png",
                    transparent: true
                }, options));
            },
            legend: function (wmsUrl, layerList) {
                var control = L.control({ position: "bottomleft" });
                control.onAdd = function () {
                    var div = L.DomUtil.create("div", "legend-box");
                    layerList.forEach(function (item) {
                        var legendUrl = wmsUrl +
                            "?REQUEST=GetLegendGraphic&VERSION=1.0.0&FORMAT=image/png&WIDTH=20&HEIGHT=20" +
                            "&LEGEND_OPTIONS=forceLabels:on&LAYER=" + encodeURIComponent(item.layer);
                        div.innerHTML += '<div class="legend-title">' + item.title + '</div>';
                        div.innerHTML += '<div><img src="' + legendUrl + '" alt="' + item.title + '" /></div>';
                    });
                    return div;
                };
                return control;
            }
        };

        // 1. Inisialisasi peta di wilayah Flores Timur
        var map = L.map("map").setView([-8.54, 122.78], 11);

        // 2. Basemap OpenStreetMap
        var osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        });
        osm.addTo(map);

        // 3. Layer 1 (Paling Bawah - zIndex: 1): Batas Administrasi
        var wmsLayer1 = L.Geoserver.wms("http://localhost:8080/geoserver/wms", {
            layers: "pgweb11:batas_kecamatan_flores_timur",
            transparent: true,
            zIndex: 1
        });
        wmsLayer1.addTo(map);

        // 4. Layer 2 (Tengah - zIndex: 2): Jaringan Jalan
        var wmsLayer2 = L.Geoserver.wms("http://localhost:8080/geoserver/wms", {
            layers: "pgweb11:jalan_flores_timur",
            transparent: true,
            zIndex: 2
        });
        wmsLayer2.addTo(map);

        // 5. Layer 3 (Paling Atas - zIndex: 3): Toponimi
        var wmsLayer3 = L.Geoserver.wms("http://localhost:8080/geoserver/wms", {
            layers: "pgweb11:toponimi_flores_timur",
            transparent: true,
            zIndex: 3
        });
        wmsLayer3.addTo(map);

        // 6. Legenda Gabungan Ketiga Layer (pojok kiri bawah)
        var layerLegend = L.Geoserver.legend("http://localhost:8080/geoserver/wms", [
            { title: "Toponimi", layer: "pgweb11:toponimi_flores_timur" },
            { title: "Jaringan Jalan", layer: "pgweb11:jalan_flores_timur" },
            { title: "Batas Administrasi", layer: "pgweb11:batas_kecamatan_flores_timur" }
        ]);
        layerLegend.addTo(map);

        // 7. Kontrol Layer (pojok kanan atas)
        var baseMaps = {
            "OpenStreetMap": osm
        };

        var overlayMaps = {
            "Batas Administrasi": wmsLayer1,
            "Jaringan Jalan": wmsLayer2,
            "Toponimi": wmsLayer3
        };

        L.control.layers(baseMaps, overlayMaps).addTo(map);
    </script>
</body>

</html>
